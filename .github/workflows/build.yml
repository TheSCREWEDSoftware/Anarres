name: Build and test

# Runs on pushes and pull requests, and as the first step of the Release workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Anarres.sln -c Release
      - name: Core tests
        run: dotnet run --project tests/Anarres.Core.Tests -c Release --no-build
      - name: Interface tests
        run: dotnet run --project tests/Anarres.App.Tests -c Release --no-build
      - name: Coding standards
        run: dotnet run --project tools/Anarres.Standards -c Release --no-build -- --all
