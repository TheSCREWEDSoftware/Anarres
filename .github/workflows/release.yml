name: Release

# Run by hand (Actions > Release > Run workflow): builds and tests first, then publishes ready-to-run Windows, Linux
# and macOS downloads as v<Version> from Directory.Build.props, with notes made from the changes since the last one
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark it as a pre-release (a test build for testers, not a finished version)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: read
        run: |
          version=$(sed -n 's|.*<Version>\([0-9.]*[^<]*\)</Version>.*|\1|p' Directory.Build.props | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stop if this version was already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.read.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::v${{ steps.read.outputs.version }} is already out; raise <Version> in Directory.Build.props"
            exit 1
          fi

  package:
    needs: [build, version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            platform: windows
          - os: ubuntu-latest
            runtime: linux-x64
            platform: linux
          - os: macos-latest
            runtime: osx-arm64
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE: Anarres-${{ needs.version.outputs.version }}-${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # One self-contained file each for the app and the command-line tool: .NET included, nothing to install
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Anarres.App -c Release -r ${{ matrix.runtime }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$PACKAGE"
          dotnet publish src/Anarres.Cli -c Release -r ${{ matrix.runtime }} --self-contained \
            -p:PublishSingleFile=true -o "$PACKAGE"

      - name: Package
        shell: bash
        run: |
          cp README.md LICENSE "$PACKAGE/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$PACKAGE.zip" "$PACKAGE"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            ${{ env.PACKAGE }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then prerelease="--prerelease"; fi
          gh release create "v$VERSION" packages/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Anarres $VERSION" --generate-notes $prerelease
