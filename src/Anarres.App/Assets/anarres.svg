<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4ff"/>
      <stop offset="0.4" stop-color="#c9a2ff"/>
      <stop offset="1" stop-color="#7a3df0"/>
    </linearGradient>
    <linearGradient id="boltDark" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#4b1fa8"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffcf3a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd84d" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffcf3a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- electric arcs crackling across, where Urras has wind -->
  <polyline points="14,96 44,88 56,98 86,84 100,92 132,76" fill="none" stroke="url(#arc)" stroke-width="5"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="120,214 150,200 164,208 196,190 212,196 240,172" fill="none" stroke="url(#arc)" stroke-width="5"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="8,156 30,150 40,158 64,146 78,150 104,136" fill="none" stroke="url(#arc)" stroke-width="4"
            stroke-linejoin="round" stroke-linecap="round"/>
  <!-- main bolt: lit face and shaded face -->
  <polygon points="150,18 120,108 146,108 110,214 168,92 140,92 172,18" fill="url(#bolt)"/>
  <polygon points="172,18 190,22 162,92 186,92 110,214 168,92 140,92" fill="url(#boltDark)"/>
  <!-- left bolt -->
  <polygon points="70,58 56,112 72,112 58,184 94,104 78,104 90,58" fill="url(#bolt)"/>
  <polygon points="90,58 102,62 90,104 104,104 58,184 94,104 78,104" fill="url(#boltDark)"/>
  <!-- right bolt -->
  <polygon points="214,96 196,142 210,142 182,214 226,132 212,132 230,96" fill="url(#bolt)"/>
  <polygon points="230,96 240,100 224,132 236,132 182,214 226,132 212,132" fill="url(#boltDark)"/>
  <!-- flying sparks -->
  <polygon points="36,40 50,46 44,64 32,56" fill="url(#bolt)"/>
  <polygon points="214,36 228,42 216,64 208,54" fill="url(#bolt)"/>
  <polygon points="26,190 40,192 50,220 34,212" fill="url(#boltDark)"/>
  <!-- burst base, as on the Urras logo -->
  <polygon points="72,224 128,206 184,226 128,236" fill="#4b1fa8" opacity="0.55"/>
  <!-- white-hot edges -->
  <polyline points="150,26 124,104 140,104 116,196" fill="none" stroke="#fffbe6" stroke-opacity="0.85" stroke-width="3"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="70,66 60,108 70,108 62,170" fill="none" stroke="#fffbe6" stroke-opacity="0.7" stroke-width="2.5"
            stroke-linejoin="round" stroke-linecap="round"/>
  <polyline points="214,104 200,138 210,138 188,198" fill="none" stroke="#fffbe6" stroke-opacity="0.7"
            stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
